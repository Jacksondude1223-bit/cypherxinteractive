name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requires Pages to be enabled once by a repo admin:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow's GITHUB_TOKEN cannot turn Pages on itself (the
      # configure-pages `enablement` option fails with "Resource not accessible
      # by integration"), so this is a one-time manual step.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
