name: Deploy to Cloudflare Workers

on:
  push:
    # Both are listed because the repository's default branch is currently
    # claude/cypherx-interactive-website-ezjwrn, not main. The job condition
    # below is what actually decides, so whichever of these is the default
    # branch at the time is the one that deploys — switch the default to main
    # later and this keeps working with no edit here.
    branches:
      - main
      - claude/cypherx-interactive-website-ezjwrn
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: true

jobs:
  deploy:
    # A push to a listed branch that is not the default branch is a no-op.
    # workflow_dispatch always runs, so a manual deploy from anywhere is still
    # possible.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Resolves the D1 database, creating it if the account has none, writes
      # its name and id into wrangler.jsonc, and applies any migrations that
      # have not run yet. The edit is to the checkout, which is discarded when
      # the job ends — nothing is committed back.
      #
      # Runs before the dry-run below so validation sees the real id rather
      # than the placeholder in the repo.
      - name: Prepare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional. Set as a repository variable when the account has more
          # than one D1 database and the right one is not matched by name.
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
        run: npm run db:setup

      # Catches config and asset-directory errors without publishing.
      - name: Validate configuration
        run: npx wrangler deploy --dry-run

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          # Repository secrets. The API token needs "Edit Cloudflare Workers"
          # and, for the Prepare D1 step above, D1:Edit.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
