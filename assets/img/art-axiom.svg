<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="AXIOM Anticheat key art">
  <defs>
    <linearGradient id="axBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="axShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29e0f0"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="axPulse" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#29e0f0" stop-opacity=".4"/>
      <stop offset="70%" stop-color="#29e0f0" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#29e0f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#axBg)"/>

  <!-- grid -->
  <g stroke="#94a3b8" stroke-opacity=".09" stroke-width="1">
    <path d="M0 60h800M0 120h800M0 180h800M0 240h800M0 300h800M0 360h800M0 420h800"/>
    <path d="M60 0v500M140 0v500M220 0v500M300 0v500M380 0v500M460 0v500M540 0v500M620 0v500M700 0v500"/>
  </g>

  <circle cx="400" cy="250" r="220" fill="url(#axPulse)"/>
  <g fill="none" stroke="#29e0f0" stroke-opacity=".22">
    <circle cx="400" cy="250" r="120"/>
    <circle cx="400" cy="250" r="168"/>
    <circle cx="400" cy="250" r="216"/>
  </g>

  <!-- shield -->
  <g transform="translate(400 250)">
    <path d="M0-118 96-76v82c0 62-40 100-96 130-56-30-96-68-96-130v-82z" fill="#070c18"/>
    <path d="M0-118 96-76v82c0 62-40 100-96 130-56-30-96-68-96-130v-82z" fill="none" stroke="url(#axShield)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-38 6 -10 36 42-28" fill="none" stroke="url(#axShield)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- scan sweep -->
  <rect x="120" y="246" width="560" height="2" fill="#29e0f0" opacity=".5"/>
  <rect x="120" y="248" width="560" height="24" fill="#29e0f0" opacity=".07"/>

  <!-- telemetry ticks -->
  <g fill="#34d399" opacity=".8">
    <rect x="88" y="404" width="4" height="18" rx="2"/>
    <rect x="100" y="396" width="4" height="26" rx="2"/>
    <rect x="112" y="410" width="4" height="12" rx="2"/>
    <rect x="124" y="388" width="4" height="34" rx="2"/>
    <rect x="136" y="402" width="4" height="20" rx="2"/>
  </g>
  <g fill="#f87171" opacity=".85">
    <rect x="664" y="392" width="4" height="30" rx="2"/>
    <rect x="676" y="380" width="4" height="42" rx="2"/>
    <rect x="688" y="400" width="4" height="22" rx="2"/>
  </g>

  <g font-family="monospace" font-size="13" fill="#6b7791">
    <text x="88" y="446">CLIENT TELEMETRY</text>
    <text x="600" y="446">ANOMALIES</text>
  </g>
</svg>
