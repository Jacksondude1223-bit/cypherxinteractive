<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="PlushX Tycoon key art">
  <defs>
    <linearGradient id="pxBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10203a"/>
      <stop offset="60%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="pxBelt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#29e0f0" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#29e0f0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="pxGlow" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#29e0f0" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#29e0f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#pxBg)"/>
  <ellipse cx="400" cy="230" rx="330" ry="220" fill="url(#pxGlow)"/>

  <!-- factory silhouette -->
  <g fill="#070c1a" stroke="#29e0f0" stroke-opacity=".35" stroke-width="2">
    <rect x="60" y="150" width="150" height="150"/>
    <rect x="228" y="196" width="120" height="104"/>
    <rect x="588" y="170" width="152" height="130"/>
    <path d="M96 150v-46h22v46M150 150v-62h22v62M628 170v-52h22v52"/>
  </g>
  <g stroke="#8b5cf6" stroke-opacity=".45" stroke-width="1.6">
    <path d="M84 178h102M84 206h102M84 234h102M252 220h72M252 248h72M612 196h104M612 226h104M612 256h104"/>
  </g>

  <!-- conveyor -->
  <rect x="40" y="352" width="720" height="26" rx="13" fill="url(#pxBelt)" stroke="#29e0f0" stroke-opacity=".4"/>
  <g fill="#29e0f0" opacity=".45">
    <circle cx="110" cy="365" r="5"/><circle cx="230" cy="365" r="5"/><circle cx="350" cy="365" r="5"/>
    <circle cx="470" cy="365" r="5"/><circle cx="590" cy="365" r="5"/><circle cx="700" cy="365" r="5"/>
  </g>

  <!-- plush hero -->
  <g transform="translate(400 268)">
    <ellipse cx="0" cy="86" rx="86" ry="12" fill="#000" opacity=".45"/>
    <circle cx="-46" cy="-44" r="24" fill="#8b5cf6"/>
    <circle cx="46" cy="-44" r="24" fill="#8b5cf6"/>
    <circle cx="-46" cy="-44" r="12" fill="#c4b5fd"/>
    <circle cx="46" cy="-44" r="12" fill="#c4b5fd"/>
    <rect x="-62" y="-56" width="124" height="118" rx="52" fill="#a78bfa"/>
    <rect x="-52" y="-6" width="104" height="66" rx="33" fill="#ddd6fe" opacity=".95"/>
    <circle cx="-22" cy="-14" r="7.5" fill="#05070d"/>
    <circle cx="22" cy="-14" r="7.5" fill="#05070d"/>
    <circle cx="-19.5" cy="-16.5" r="2.4" fill="#fff"/>
    <circle cx="24.5" cy="-16.5" r="2.4" fill="#fff"/>
    <path d="M-14 12q14 14 28 0" stroke="#05070d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-34" cy="8" r="8" fill="#f472b6" opacity=".55"/>
    <circle cx="34" cy="8" r="8" fill="#f472b6" opacity=".55"/>
  </g>

  <!-- currency -->
  <g font-family="monospace" font-size="26" font-weight="700" fill="#fbbf24" opacity=".85">
    <text x="150" y="120">$</text>
    <text x="640" y="106">$</text>
    <text x="540" y="150" font-size="18">$</text>
    <text x="250" y="146" font-size="18">$</text>
