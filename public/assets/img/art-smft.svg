<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="SMFT: Gods key art">
  <defs>
    <linearGradient id="smftSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1040"/>
      <stop offset="45%" stop-color="#0d1330"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="smftSun" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#f472b6" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smftBolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="smftFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#29e0f0" stop-opacity=".05"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#smftSky)"/>
  <circle cx="400" cy="250" r="230" fill="url(#smftSun)"/>

  <!-- distant peaks -->
  <path d="M0 330 120 236 208 300 300 214 400 306 510 220 600 300 700 240 800 320v180H0z" fill="#0a0d20" opacity=".9"/>

  <!-- temple -->
  <g fill="#080b18" stroke="#8b5cf6" stroke-opacity=".55" stroke-width="2">
    <path d="M290 330h220l-24-40H314z"/>
    <rect x="316" y="212" width="168" height="78"/>
    <path d="M300 212 400 150l100 62z"/>
  </g>
  <g stroke="#29e0f0" stroke-opacity=".45" stroke-width="2">
    <path d="M340 212v78M375 212v78M425 212v78M460 212v78"/>
  </g>

  <!-- bolt -->
  <path d="M424 60 356 214h52l-30 118 96-166h-56l30-106z" fill="url(#smftBolt)" opacity=".92"/>

  <!-- grid floor -->
  <g stroke="url(#smftFloor)" stroke-width="1.4" fill="none" opacity=".8">
    <path d="M0 336h800M0 356h800M0 382h800M0 416h800M0 458h800"/>
    <path d="M400 330 400 500M400 330 180 500M400 330 620 500M400 330-60 500M400 330 860 500M400 330 300 500M400 330 500 500"/>
  </g>

  <!-- runes -->
  <g fill="#29e0f0" opacity=".7">
    <circle cx="120" cy="120" r="3"/><circle cx="660" cy="96" r="2.4"/>
    <circle cx="712" cy="168" r="3.4"/><circle cx="86" cy="212" r="2.2"/>
    <circle cx="590" cy="140" r="2"/><circle cx="200" cy="80" r="2.6"/>
  </g>
</svg>
